name: Pipeline World Bank (ingestion + dbt)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Creer la cle BigQuery
        run: echo '${{ secrets.GCP_SA_KEY }}' > "$GITHUB_WORKSPACE/cle_bigquery.json"

      - name: Configurer le profil dbt
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          wild_data_hub:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: data-quest-sebastien
                dataset: dbt_dev
                keyfile: $GITHUB_WORKSPACE/cle_bigquery.json
                location: US
                threads: 4
          EOF

      - name: Lancer le pipeline
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/cle_bigquery.json
          GCP_PROJECT_ID: data-quest-sebastien
        run: python run_pipeline.py
