version: 2

models:
  - name: dim_pays
    description: "Dimension des pays, territoires et agrégats géographiques."

    columns:
      - name: country_key
        description: "Clé du pays basée sur le code ISO3 ou l'identifiant géographique."
        data_tests:
          - not_null
          - unique

      - name: country_name
        description: "Nom du pays, territoire ou agrégat géographique."

  - name: dim_annee
    description: "Dimension des années disponibles dans les données."

    columns:
      - name: annee_key
        description: "Clé de l'année."
        data_tests:
          - not_null
          - unique

      - name: annee
        description: "Année de l'observation."

  - name: dim_indicator
    description: "Dimension des indicateurs de la Banque mondiale."

    columns:
      - name: indicator_key
        description: "Clé de l'indicateur basée sur son code Banque mondiale."
        data_tests:
          - not_null
          - unique

      - name: indicator_code
        description: "Code de l'indicateur Banque mondiale."

      - name: indicator_name
        description: "Nom de l'indicateur Banque mondiale."

  - name: fact_indicators
    description: "Table de faits contenant une observation par pays, année et indicateur."

    columns:
      - name: country_key
        description: "Clé étrangère vers dim_pays."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pays')
                field: country_key

      - name: annee_key
        description: "Clé étrangère vers dim_annee."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_annee')
                field: annee_key

      - name: indicator_key
        description: "Clé étrangère vers dim_indicator."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_indicator')
                field: indicator_key

      - name: value
        description: "Valeur de l'indicateur pour le pays et l'année."

  - name: mart_country_indicators
    description: "Table analytique regroupant les principaux indicateurs de la Banque mondiale avec une ligne par pays et par année."

    columns:
      - name: country_name
        description: "Nom du pays, territoire ou agrégat géographique."

      - name: countryiso3code
        description: "Code ISO3 ou identifiant géographique fourni par la Banque mondiale."

      - name: annee
        description: "Année de l'observation."
        data_tests:
          - not_null

      - name: pib
        description: "Produit intérieur brut."

      - name: pib_par_habitant
        description: "Produit intérieur brut par habitant."

      - name: croissance_pib
        description: "Taux de croissance annuel du PIB."

      - name: population
        description: "Population totale."

      - name: esperance_vie
        description: "Espérance de vie à la naissance."

      - name: chomage
        description: "Taux de chômage."

      - name: inflation
        description: "Taux d'inflation."

      - name: acces_electricite
        description: "Part de la population ayant accès à l'électricité."

      - name: co2_par_habitant
        description: "Émissions de CO₂ par habitant."

      - name: taux_natalite
        description: "Taux de natalité."

      - name: scolarisation_secondaire
        description: "Taux de scolarisation dans l'enseignement secondaire."

      - name: scolarisation_superieur
        description: "Taux de scolarisation dans l'enseignement supérieur."

      - name: achevement_primaire
        description: "Taux d'achèvement de l'enseignement primaire."

      - name: depense_de_sante
        description: "Dépenses courantes de santé en pourcentage du PIB."

      - name: depense_publique_education
        description: "Dépenses publiques d'éducation en pourcentage du PIB."

      - name: alphabetisation_adultes
        description: "Taux d'alphabétisation des adultes."

  - name: world_bank_features
    description: "Table de préparation des variables utilisées par le modèle de Machine Learning pour estimer l'espérance de vie."

    columns:
      - name: country_name
        description: "Nom du pays, territoire ou agrégat géographique."

      - name: countryiso3code
        description: "Code ISO3 ou identifiant géographique fourni par la Banque mondiale."

      - name: annee
        description: "Année de l'observation."
        data_tests:
          - not_null

      - name: esperance_vie
        description: "Variable cible du modèle : espérance de vie à la naissance."

      - name: pib_par_habitant
        description: "Variable explicative : produit intérieur brut par habitant."

      - name: taux_natalite
        description: "Variable explicative : taux de natalité."

      - name: acces_electricite
        description: "Variable explicative : part de la population ayant accès à l'électricité."

      - name: co2_par_habitant
        description: "Variable explicative : émissions de CO₂ par habitant."