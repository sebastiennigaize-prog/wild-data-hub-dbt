version: 2

models:
  - name: stg_world_bank
    description: "Données économiques, démographiques, sociales, éducatives et environnementales issues de la Banque mondiale, structurées au format long."

    columns:
      - name: country_name
        description: "Nom du pays, territoire ou agrégat géographique."

      - name: countryiso3code
        description: "Code ISO3 ou identifiant géographique fourni par la Banque mondiale."
        data_tests:
          - not_null

      - name: annee
        description: "Année de l'observation."
        data_tests:
          - not_null

      - name: indicator_code
        description: "Code unique de l'indicateur Banque mondiale."
        data_tests:
          - not_null

      - name: indicator_name
        description: "Libellé de l'indicateur Banque mondiale."

      - name: value
        description: "Valeur observée pour le pays, l'année et l'indicateur. Peut être nulle lorsqu'aucune donnée n'est disponible."

      - name: unit
        description: "Unité fournie par l'API Banque mondiale."

      - name: obs_status
        description: "Statut de l'observation fourni par l'API."

      - name: decimal
        description: "Information de précision décimale fournie par l'API."

      - name: row_hash
        description: "Empreinte SHA-256 utilisée pour identifier une observation et éviter les doublons."
        data_tests:
          - not_null

      - name: inserted_at
        description: "Date et heure UTC d'insertion de la donnée dans la zone raw."